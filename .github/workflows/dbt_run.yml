name: dbt Run and Test

on:
  schedule:
    - cron: '0 14 * * 1-5'  # runs at 9am EST Monday-Friday
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-databricks
        run: pip install dbt-databricks

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<EOF > ~/.dbt/profiles.yml
          stock_analytics_project:
            target: dev
            outputs:
              dev:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: workspace
                schema: analytics
                threads: 4
          EOF

      - name: dbt run
        run: dbt run
        working-directory: .

      - name: dbt test
        run: dbt test
        working-directory: .

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::dbt workflow failed — check the steps above for details"
          echo "Failed step logs are available in the GitHub Actions run summary"
