version: 2

models:
  - name: stg_stock_prices
    description: Raw stock price data sourced from yfinance
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
      - name: trade_date
        description: Date of the trading day
        tests:
          - not_null
      - name: open
        tests:
          - not_null
      - name: high
        tests:
          - not_null
      - name: low
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: volume
        tests:
          - not_null