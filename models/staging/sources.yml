version: 2

sources:
  - name: analytics
    config:
      freshness:
        warn_after: {count: 1, period: day}
        # A single missed daily load already reads as ~34h, since the ETL and
        # dbt schedules sit ~11h apart. 2 days flags a real stall one run sooner
        # than 3 without tripping on one late run.
        error_after: {count: 2, period: day}
      loaded_at_field: run_ts
    tables:
      - name: stock_prices
      - name: dim_ticker
        config:
          freshness: null  # dim_ticker updates rarely, skip freshness check
      - name: macd_signals
        config:
          freshness: null  # computed on-demand by compute_macd.py, not a daily feed
