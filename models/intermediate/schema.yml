version: 2

models:
  - name: int_daily_metrics
    description: Daily metrics including daily returns, 10/20/50 day moving averages
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
      - name: trade_date
        description: Date of the trading day
        tests:
          - not_null
      - name: close
        tests:
          - not_null
      - name: daily_return
      - name: ma_10
        description: 10 day moving average
      - name: ma_20
        description: 20 day moving average
      - name: ma_50
        description: 50 day moving average

unit_tests:
  - name: test_percent_change_calculation
    model: int_daily_metrics
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_stock_prices')
        rows:
          - {ticker: 'AAPL', trade_date: '2026-01-01', close: 110, open: 100, high: 115, low: 95, volume: 1000}
          - {ticker: 'AAPL', trade_date: '2026-01-02', close: 121, open: 110, high: 125, low: 105, volume: 1100}
    expect:
      rows:
        - {ticker: 'AAPL', trade_date: '2026-01-01', daily_return: null}
        - {ticker: 'AAPL', trade_date: '2026-01-02', daily_return: 0.1}
   
    